name: Trusted Repository Guard

# The guard step inside Project CI lives in a workflow file that a pull request
# can edit, so on its own it is advisory: a proposal could delete the step.
# This workflow is the immutable half. `workflow_run` always executes the
# default branch's copy of this file and the default branch's policy, whatever
# the proposal contains, and publishes the result as a check bound to the exact
# pull-request head SHA.
#
# The default branch's policy holds this file by its exact bytes, not by a
# description of what its body should contain: `TRUSTED_VERIFIER_DIGESTS` in
# `scripts/repository-guard.mjs` lists the digests it accepts. Changing this
# file therefore takes two pull requests, the digest first — the guard that
# judges a proposal is the default branch's copy, so a proposal cannot bring
# the digest for its own rewrite with it.
#
# One residual is not closable here, and is recorded rather than papered over.
# `workflow_run` selects the upstream workflow by name, so a proposal that
# renames Project CI stops this job from firing at all, and could then publish
# `project-ci` and `trusted-repository-guard` from its own renamed workflow. The
# guard reserves both names, but the guard is what this job runs — the
# enforcement is circular in exactly that case. What closes it is repository
# configuration rather than a workflow: branch protection requiring these checks
# plus Code Owner review on `/.github/workflows/`, which CODEOWNERS already
# declares and the migration handoff lists as open closeout work. A rename
# touches that path and needs the owner's approval.

on:
  workflow_run:
    workflows:
      - Project CI
    types:
      - completed

permissions:
  contents: read
  checks: write

jobs:
  verify:
    name: trusted-repository-guard
    # Every pull-request-originated completion runs this job. An association
    # that is not exactly one is published as a failure, never skipped: GitHub
    # treats a skipped required job as non-blocking, which would satisfy the
    # context without the default branch's policy ever seeing the head.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the trusted policy from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout the proposed pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .guard-proposed

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Test the default branch's guard before judging with it
        run: node --test "tests/repository-guard.test.mjs"

      - name: Judge the proposed head with the default branch's guard
        id: guard
        shell: bash
        env:
          ASSOCIATED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          SECOND_ASSOCIATION: ${{ github.event.workflow_run.pull_requests[1].head.sha }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set +e
          conclusion=success
          summary="The default branch's repository guard passed on this pull-request head."
          if [ -z "$ASSOCIATED_HEAD_SHA" ]; then
            conclusion=failure
            summary="The Project CI run has no pull-request association to verify."
          elif [ -n "$SECOND_ASSOCIATION" ]; then
            conclusion=failure
            summary="The Project CI run is associated with more than one pull request."
          elif [ "$RUN_HEAD_SHA" != "$ASSOCIATED_HEAD_SHA" ]; then
            conclusion=failure
            summary="The Project CI run's SHA does not match the associated pull-request head."
          else
            node "$GITHUB_WORKSPACE/scripts/repository-guard.mjs" \
              --root "$GITHUB_WORKSPACE/.guard-proposed"
            if [ "$?" -ne 0 ]; then
              conclusion=failure
              summary="The default branch's repository guard rejected this pull-request head."
            fi
          fi
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Publish the head-bound result
        env:
          CONCLUSION: ${{ steps.guard.outputs.conclusion }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SUMMARY: ${{ steps.guard.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            --method POST \
            -f name=trusted-repository-guard \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion="$CONCLUSION" \
            -f 'output[title]=Trusted repository guard' \
            -f "output[summary]=$SUMMARY"
          [ "$CONCLUSION" = "success" ]
