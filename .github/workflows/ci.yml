name: Project CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-ci:
    name: project-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the proposed repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout the trusted guard from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .guard-trusted
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked website dependencies
        run: npm ci --prefix website

      - name: Build and test the website
        run: npm --prefix website run check

      # The policy that judges a pull request always comes from the default
      # branch, never from the proposed copy, so a proposal cannot weaken the
      # guard that is judging it.
      - name: Run the repository safety guard
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ ! -f .guard-trusted/.web-design/project.json ]; then
            node .guard-trusted/scripts/check-repository.mjs --root "$GITHUB_WORKSPACE"
            exit 0
          fi

          # Cutover only. The default branch still carries the retired baseline
          # guard, which requires the .web-design files this pull request
          # deletes, so running it on the proposed tree would fail for the wrong
          # reason. Run that trusted guard unmodified against a scratch tree that
          # is the default branch with this head laid over it: every proposed
          # byte is still scanned by trusted policy, and the only thing excused
          # is the absence of the retired files. The proposed guard runs too, so
          # a deletion the compatibility tree restores is still caught.
          echo "::warning::Cutover: the default branch still carries the retired baseline guard, so it is run against a compatibility tree. This branch disappears once this pull request merges."
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          compat="$RUNNER_TEMP/guard-compat"
          rm -rf "$compat"
          git worktree add --detach "$compat" FETCH_HEAD
          git -C "$compat" checkout "$HEAD_SHA" -- .
          node .guard-trusted/scripts/check-repository.mjs --root "$compat"
          node scripts/check-repository.mjs

      - name: Test the repository safety guard and the Codex gate
        run: node --test "tests/*.test.mjs"

  osv-scan:
    name: osv-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Scan dependencies
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --recursive
            .
