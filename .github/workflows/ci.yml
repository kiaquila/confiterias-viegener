name: Project CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-ci:
    name: project-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the proposed repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout the trusted guard from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .guard-trusted
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked website dependencies
        run: npm ci --prefix website

      - name: Build and test the website
        run: npm --prefix website run check

      # The policy that judges a pull request always comes from the default
      # branch, never from the proposed copy, so a proposal cannot weaken the
      # guard that is judging it.
      - name: Run the repository safety guard
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ ! -f .guard-trusted/.web-design/project.json ]; then
            node .guard-trusted/scripts/check-repository.mjs --root "$GITHUB_WORKSPACE"
            exit 0
          fi

          # Cutover only. The default branch still carries the retired baseline
          # guard, which requires the .web-design files this pull request
          # deletes, so running it on the proposed tree would fail for the wrong
          # reason. Run that trusted guard unmodified against a scratch tree that
          # is the proposed head with only the retired paths restored. The tree
          # starts from the proposal, so every proposed change — additions,
          # edits and deletions alike — is judged by trusted policy; the named
          # allowlist below is the only thing excused, and it is exactly what
          # this pull request retires.
          echo "::warning::Cutover: the default branch still carries the retired baseline guard, so it is run against a compatibility tree. This branch disappears once this pull request merges."
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          # FETCH_HEAD is per-worktree, so resolve it before the worktree exists.
          default_sha="$(git rev-parse FETCH_HEAD)"
          compat="$RUNNER_TEMP/guard-compat"
          rm -rf "$compat"
          git worktree add --detach "$compat" "$HEAD_SHA"
          git -C "$compat" checkout "$default_sha" -- \
            .web-design \
            .github/workflows/baseline-source-verification.yml \
            .github/workflows/osv-scan.yml \
            .github/workflows/repository-guard.yml \
            .github/workflows/web-design-update.yml \
            docs/operations/bootstrap.md \
            docs/operations/github-setup.md \
            docs/operations/updates.md \
            scripts/build-release-manifest.mjs \
            scripts/check-baseline-change.mjs \
            scripts/check-managed-files.mjs \
            scripts/run-project-checks.mjs \
            scripts/sync-project.mjs \
            scripts/test-web-design.mjs
          node .guard-trusted/scripts/check-repository.mjs --root "$compat"

      - name: Test the repository safety guard and the Codex gate
        run: node --test "tests/*.test.mjs"

  osv-scan:
    name: osv-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Scan dependencies
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --recursive
            .
